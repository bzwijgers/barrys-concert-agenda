name: Debug new venue dates
on:
  push:
    branches: [main]
    paths:
      - "diagnostics/date_debug.py"
      - ".github/workflows/date-debug.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u -m diagnostics.date_debug
