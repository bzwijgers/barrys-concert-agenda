name: Inspect alternate concert sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/aggregator_probe.py"
      - ".github/workflows/alternate-source-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify alternative venue metadata
        run: PYTHONPATH=. python -u audit/aggregator_probe.py
