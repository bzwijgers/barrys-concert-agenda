name: Probe Bibelot pagination

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/bibelot_pagination_probe.py"
      - ".github/workflows/bibelot-pagination-probe.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u diagnostics/bibelot_pagination_probe.py
