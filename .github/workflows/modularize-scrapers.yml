name: Modularize scrapers

on:
  push:
    branches:
      - modular-scrapers

permissions:
  contents: write

jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: modular-scrapers

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Split scraper into modules
        run: python modularize_scraper.py

      - name: Compile Python files
        run: python -m compileall -q scraper.py scrapers

      - name: Commit modular structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Refactor scraper into venue modules"
          git push origin modular-scrapers
