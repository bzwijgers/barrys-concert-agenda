name: Diagnose BIRD live agenda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/bird_probe.py"
      - ".github/workflows/bird-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect BIRD agenda HTML
        run: python -u diagnostics/bird_probe.py
