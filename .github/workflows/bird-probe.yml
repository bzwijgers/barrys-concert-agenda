name: Verify BIRD live agenda

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/bird_probe.py"
      - "scrapers/bird.py"
      - "tests/test_bird.py"
      - ".github/workflows/bird-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test BIRD live scraper
        run: python -m unittest discover -s tests -p "test_bird.py" -v
      - name: Fetch and check all future BIRD Live concerts
        run: |
          python -u - <<'PY'
          from scrapers.bird import scrape_bird
          events = scrape_bird()
          for event in events:
              print(event["date"], event["time"], event["artist"], event["venue"], event["url"])
          print("CONFIRMED BIRD LIVE EVENTS:", len(events))
          PY
