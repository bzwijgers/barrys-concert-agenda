name: Publish verified TicketSwap event links
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/publish_ticketswap_sitemaps.py"
      - "tests/test_ticketswap_sitemaps.py"
      - ".github/workflows/publish-ticketswap-sitemaps.yml"
      - "concerts.json"

permissions:
  contents: write

concurrency:
  group: public-ticketswap-sitemaps
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test matching and preservation rules
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_ticketswap_sitemaps.py'
          PYTHONPATH=. python -m unittest discover -s tests -p 'test_preserve_ticketswap_links.py'
      - name: Download all official public event sitemaps
        run: PYTHONPATH=. python -u -m audit.publish_ticketswap_sitemaps collect
      - name: Merge exact event links into the latest published concert feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            PYTHONPATH=. python -u -m audit.publish_ticketswap_sitemaps apply
            git add concerts.json
            if git diff --cached --quiet; then
              echo "No additional exact TicketSwap matches; keeping verified feed"
              exit 0
            fi
            git commit -m "Enrich concerts with verified direct TicketSwap event links"
            if git push origin HEAD:main; then
              echo "SUCCESS published TicketSwap links"
              exit 0
            fi
          done
          exit 1
      - name: Verify actual published TicketSwap feed
        run: |
          python - <<'PY'
          import json, time
          from urllib.request import urlopen, Request
          base = "https://bzwijgers.github.io/barrys-concert-agenda/concerts.json"
          for attempt in range(12):
              url = base + "?ticketswap_verify=" + str(${{ github.run_id }}) + "-" + str(attempt)
              try:
                  with urlopen(Request(url, headers={"Cache-Control": "no-cache"}), timeout=22) as response:
                      events = json.load(response)
                  linked = sum(bool(event.get("ticketSwapUrl")) for event in events)
                  print("LIVE APP FEED:", len(events), "concerts,", linked, "TicketSwap URLs", flush=True)
                  if linked >= 1000:
                      print("VERIFIED: Android feed includes direct event links", flush=True)
                      break
              except Exception as exc:
                  print("LIVE FEED RETRY", repr(exc), flush=True)
              time.sleep(8)
          else:
              raise SystemExit("Live GitHub Pages feed is still missing verified TicketSwap URLs")
          PY
