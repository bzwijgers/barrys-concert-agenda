name: Test concert scraper

on:
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Effenaar scraper
        run: python scraper.py

      - name: Copy concerts.json to Pages
        run: |
          test -f concerts.json
          cp concerts.json ./concerts.json

      - name: Commit concerts.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add concerts.json
          git commit -m "Update Effenaar concerts" || echo "No changes"
          git push
