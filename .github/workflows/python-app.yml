name: Test concert scraper

on:
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Effenaar scraper
        run: python scraper.py

      - name: Save concerts.json
        uses: actions/upload-artifact@v4
        with:
          name: effenaar-concerts
          path: concerts.json
