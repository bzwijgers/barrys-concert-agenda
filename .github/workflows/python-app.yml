name: Test concert scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Effenaar scraper
        run: python scraper.py

      - name: Check concerts.json
        run: |
          test -f concerts.json
          echo "concerts.json successfully created"

      - name: Upload concerts.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: concerts-json
          path: concerts.json

      - name: Publish concerts.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts.json
          git diff --cached --quiet || git commit -m "Update concerts.json"
          git push origin main
