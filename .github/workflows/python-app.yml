name: Update concert agenda
# Workflow trigger check: 2026-10-06

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "scrapers/**"
      - "tests/**"
      - ".github/workflows/python-app.yml"

  schedule:
    # Elke ochtend 07:00 Nederlandse tijd, ook na omschakeling zomer/winter.
    - cron: "0 7 * * *"
      timezone: "Europe/Amsterdam"

permissions:
  contents: write

concurrency:
  group: concert-feed-main
  # Never discard a near-finished full scrape when improvements are committed.
  # Later runs are queued and use the newest source code.
  cancel-in-progress: false

jobs:
  update-concerts:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m compileall -q scraper.py scrapers

      - name: Test scraper parsing
        id: unit_tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Check live Paradiso detail parsing
        id: live
        continue-on-error: true
        run: |
          python - <<'PY'
          from scrapers.common import download_page_retry
          from scrapers.paradiso import paradiso_parse_event
          url = "https://www.paradiso.nl/nl/programma/this-is-the-kit/2931706"
          html = download_page_retry(url, attempts=5)
          item = paradiso_parse_event(html, url)
          print("Live Paradiso HTML bytes:", len(html))
          print("Live Paradiso parsed:", item, flush=True)
          expected = ("This Is the Kit", "Tolhuistuin", "2027-05-07", "20:30")
          actual = (
              item.get("artist"), item.get("venue"), item.get("date"), item.get("time")
          ) if item else None
          if actual != expected:
              raise SystemExit(f"Paradiso live parser regression: {actual!r} != {expected!r}")
          PY

      - name: Check Ticketmaster API availability
        id: ticketmaster_check
        continue-on-error: true
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from scrapers.ticketmaster_nl import _get_json, MUSIC_SEGMENT
          key = os.getenv("TICKETMASTER_API_KEY", "").strip()
          if not key:
              raise SystemExit("TICKETMASTER CHECK FAILED: secret absent or empty")
          try:
              payload = _get_json({
                  "countryCode": "NL", "segmentId": MUSIC_SEGMENT,
                  "size": 1, "sort": "date,asc",
                  "startDateTime": date.today().isoformat() + "T00:00:00Z",
              }, key)
          except Exception as exc:
              raise SystemExit("TICKETMASTER CHECK FAILED: " + type(exc).__name__ + " " + str(exc))
          total = (payload.get("page") or {}).get("totalElements")
          print("TICKETMASTER CHECK OK: Dutch music events available:", total)
          if not isinstance(total, int):
              raise SystemExit("TICKETMASTER CHECK FAILED: no valid page count")
          PY

      - name: Run concert scraper
        id: scrape
        env:
          # GitHub Actions secret, never committed or shown in debug logs.
          # If unset, Ticketmaster is skipped without affecting any other halls.
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -u scraper.py

      - name: Enrich direct TicketSwap links from official public event sitemaps
        id: enrich_ticketswap
        run: |
          PYTHONPATH=. python -u -m audit.publish_ticketswap_sitemaps collect
          PYTHONPATH=. python -u -m audit.publish_ticketswap_sitemaps apply

      - name: Check concerts.json
        id: verify
        run: |
          test -f concerts.json
          python - <<'PY'
          import json
          from collections import Counter

          with open("concerts.json", encoding="utf-8") as handle:
              concerts = json.load(handle)

          counts = Counter(item.get("source", "") for item in concerts)
          required = ("Effenaar", "Rotown", "013", "Paradiso", "Baroeg", "Boerderij", "PAARD", "Melkweg", "TivoliVredenburg", "MEZZ", "Patronaat", "Tolhuistuin", "Gebouw-T", "dB's", "De Helling", "Klokgebouw", "Dynamo", "Doornroosje", "BIRD", "Metropool", "Hedon", "SPOT Groningen", "Neushoorn", "Bibelot", "De Pul", "De Bosuil", "Amare", "Bolwerk")
          missing = [source for source in required if counts[source] == 0]

          print("Concert count:", len(concerts))
          print("Per source:", dict(counts))
          thresholds = {"De Helling": 10, "Doornroosje": 20, "Hedon": 20, "SPOT Groningen": 30, "Neushoorn": 20, "Metropool": 20, "Bibelot": 30, "De Pul": 25, "De Bosuil": 40}
          too_few = {s: (counts[s], limit) for s,limit in thresholds.items() if counts[s] < limit}
          if too_few:
              raise SystemExit("Incomplete newly added venue feeds: " + repr(too_few))

          puscifer = [
              item for item in concerts
              if item.get("url") == "https://www.013.nl/programma/128504/puscifer"
          ]
          if puscifer and puscifer[0].get("artist") != "Puscifer":
              raise SystemExit(
                  "013 regression: Puscifer artist is "
                  + repr(puscifer[0].get("artist"))
              )

          paradiso_total = counts["Paradiso"] + counts["Tolhuistuin"]
          # Dynamische vergelijking met de vorige gepubliceerde feed
          # gebeurt al in scraper.py. Dit is een aanvullende sanitycheck.
          if paradiso_total < 1:
              raise SystemExit("Paradiso/Tolhuistuin heeft geen concerten gevonden")

          paradiso_expected = {
              "https://www.paradiso.nl/nl/programma/30-jaar-excelsior-recordings/2902321":
                  ("30 Jaar Excelsior Recordings", "Tolhuistuin", "2026-12-27", "16:00"),
              "https://www.paradiso.nl/nl/programma/honey-im-home/2841259":
                  ("Honey I'm Home", "Tolhuistuin", "2026-12-30", "20:30"),
              "https://www.paradiso.nl/nl/programma/hans-williams/2927434":
                  ("Hans Williams", "Tolhuistuin", "2026-12-05", "20:30"),
              "https://www.paradiso.nl/nl/programma/the-tubs/2886934":
                  ("The Tubs", "Tolhuistuin", "2026-12-06", "19:30"),
              "https://www.paradiso.nl/nl/programma/the-mary-wallopers/2926204":
                  ("The Mary Wallopers", "Paradiso", "2027-01-30", "20:00"),
              "https://www.paradiso.nl/nl/programma/friendly-fires/2933529":
                  ("Friendly Fires", "Tolhuistuin", "2027-01-28", "20:30"),
              "https://www.paradiso.nl/nl/programma/fat-freddys-drop/2654360":
                  ("Fat Freddy's Drop + DJ Logg Cabin", "Paradiso", "2026-10-12", "20:30"),
              "https://www.paradiso.nl/nl/programma/songhoy-blues/2884193":
                  ("Songhoy Blues", "Tolhuistuin", "2026-10-10", "20:30"),
              "https://www.paradiso.nl/nl/programma/this-is-the-kit/2931706":
                  ("This Is the Kit", "Tolhuistuin", "2027-05-07", "20:30"),
          }
          by_url = {item.get("url"): item for item in concerts}
          from datetime import date
          for url, expected in paradiso_expected.items():
              if expected[2] < date.today().isoformat():
                  continue
              item = by_url.get(url)
              if not item:
                  raise SystemExit("Paradiso regression: missing " + url)
              actual = (item.get("artist"), item.get("venue"), item.get("date"), item.get("time"))
              if actual != expected:
                  raise SystemExit(
                      "Paradiso regression for " + url + ": "
                      + repr(actual) + " != " + repr(expected)
                  )

          if missing:
              raise SystemExit(
                  "Refusing to publish: no concerts found for " + ", ".join(missing)
              )
          PY

      - name: Verify published-source coverage and recovered concerts
        run: python -u diagnostics/feed_qa.py

      - name: Upload concerts.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: concerts-json
          path: concerts.json

      - name: Publish concerts.json to main
        id: publish
        run: |
          # Save the already verified output before synchronising main.
          # Rebasing two generated JSON feeds creates unnecessary conflicts.
          cp concerts.json /tmp/validated-concerts.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp concerts.json /tmp/latest-published-concerts.json
            cp /tmp/validated-concerts.json concerts.json
            # A scraper started before TicketSwap enrichment must not delete
            # verified links published in the meantime.
            PYTHONPATH=. python -u -m audit.merge_published_ticketswap \
              /tmp/latest-published-concerts.json concerts.json
            git add concerts.json
            if git diff --cached --quiet; then
              echo "Concert feed already up-to-date"
              exit 0
            fi
            git commit -m "Update concerts.json"
            if git push origin HEAD:main; then
              echo "Concert feed published successfully"
              exit 0
            fi
            echo "Concurrent update detected; retrying publish: $attempt"
          done
          echo "Unable to publish validated feed after 3 attempts"
          exit 1

      - name: Record scraper run status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p .github
          cat > .github/last-scrape-status.json <<'STATUS'
          {
            "run_id": ${{ github.run_id }},
            "source_commit": "${{ github.sha }}",
            "unit_tests": "${{ steps.unit_tests.outcome }}",
            "paradiso_live": "${{ steps.live.outcome }}",
            "full_scrape": "${{ steps.scrape.outcome }}",
            "feed_validation": "${{ steps.verify.outcome }}",
            "publish": "${{ steps.publish.outcome }}"
          }
          STATUS
          git add .github/last-scrape-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Record concert scraper verification status"
            git push origin HEAD:main
          fi
