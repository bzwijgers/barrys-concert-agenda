name: Update concert agenda
# Workflow trigger check: 2026-10-06

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "scrapers/**"
      - "tests/**"
      - ".github/workflows/python-app.yml"

  schedule:
    # GitHub Actions gebruikt UTC.
    # 05:00 UTC = 07:00 in Nederland tijdens zomertijd.
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-concerts:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m compileall -q scraper.py scrapers

      - name: Test scraper parsing
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Discover complete Paradiso source
        run: |
          python - <<'PY'
          import re
          from scrapers.common import download_page_retry
          html = download_page_retry("https://www.paradiso.nl/landing/concertagenda-paradiso/2069817")
          print("chars", len(html))
          for needle in ("__NEXT_DATA__", "__APOLLO_STATE__", "api/", "graphql", "algolia", "programItems", "events", "pageSize", "limit"):
              print("\nNEEDLE", needle)
              for m in list(re.finditer(re.escape(needle), html, re.I))[:8]:
                  print(html[max(0,m.start()-500):m.start()+1200].replace("\n"," ")[:1700])
          scripts = re.findall(r'<script[^>]+src=["\\\']([^"\\\']+)["\\\']', html, re.I)
          print("\nSCRIPTS", scripts[-30:])
          raise SystemExit("Paradiso source discovery complete")
          PY

      - name: Run concert scraper
        run: python scraper.py

      - name: Check concerts.json
        run: |
          test -f concerts.json
          python - <<'PY'
          import json
          from collections import Counter

          with open("concerts.json", encoding="utf-8") as handle:
              concerts = json.load(handle)

          counts = Counter(item.get("source", "") for item in concerts)
          required = ("Effenaar", "Rotown", "013", "Paradiso", "Baroeg", "Boerderij", "PAARD", "Melkweg", "TivoliVredenburg", "MEZZ", "Patronaat", "Tolhuistuin")
          missing = [source for source in required if counts[source] == 0]

          print("Concert count:", len(concerts))
          print("Per source:", dict(counts))

          puscifer = [
              item for item in concerts
              if item.get("url") == "https://www.013.nl/programma/128504/puscifer"
          ]
          if puscifer and puscifer[0].get("artist") != "Puscifer":
              raise SystemExit(
                  "013 regression: Puscifer artist is "
                  + repr(puscifer[0].get("artist"))
              )

          paradiso_expected = {
              "https://www.paradiso.nl/nl/programma/30-jaar-excelsior-recordings/2902321":
                  ("30 Jaar Excelsior Recordings", "Tolhuistuin", "2026-12-27", "16:00"),
              "https://www.paradiso.nl/nl/programma/honey-im-home/2841259":
                  ("Honey I'm Home", "Tolhuistuin", "2026-12-30", "20:30"),
              "https://www.paradiso.nl/nl/programma/hans-williams/2927434":
                  ("Hans Williams", "Tolhuistuin", "2026-12-05", "20:30"),
              "https://www.paradiso.nl/nl/programma/the-tubs/2886934":
                  ("The Tubs", "Tolhuistuin", "2026-12-06", "19:30"),
              "https://www.paradiso.nl/nl/programma/fat-freddys-drop/2654360":
                  ("Fat Freddy's Drop + DJ Logg Cabin", "Paradiso", "2026-10-12", "20:30"),
          }
          by_url = {item.get("url"): item for item in concerts}
          for url, expected in paradiso_expected.items():
              item = by_url.get(url)
              if not item:
                  raise SystemExit("Paradiso regression: missing " + url)
              actual = (item.get("artist"), item.get("venue"), item.get("date"), item.get("time"))
              if actual != expected:
                  raise SystemExit(
                      "Paradiso regression for " + url + ": "
                      + repr(actual) + " != " + repr(expected)
                  )

          if missing:
              raise SystemExit(
                  "Refusing to publish: no concerts found for " + ", ".join(missing)
              )
          PY

      - name: Upload concerts.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: concerts-json
          path: concerts.json

      - name: Publish concerts.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts.json
          git diff --cached --quiet || git commit -m "Update concerts.json"
          git push origin main
