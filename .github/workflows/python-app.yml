name: Update concert agenda

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "scrapers/**"
      - ".github/workflows/python-app.yml"

  schedule:
    # GitHub Actions gebruikt UTC.
    # 05:00 UTC = 07:00 in Nederland tijdens zomertijd.
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-concerts:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m compileall -q scraper.py scrapers

      - name: Run concert scraper
        run: python scraper.py

      - name: Check concerts.json
        run: |
          test -f concerts.json
          python - <<'PY'
          import json
          from collections import Counter

          with open("concerts.json", encoding="utf-8") as handle:
              concerts = json.load(handle)

          counts = Counter(item.get("source", "") for item in concerts)
          required = ("Effenaar", "Rotown", "013", "Paradiso", "Baroeg", "Boerderij", "PAARD", "Melkweg", "TivoliVredenburg", "MEZZ", "Patronaat", "Tolhuistuin")
          missing = [source for source in required if counts[source] == 0]

          print("Concert count:", len(concerts))
          print("Per source:", dict(counts))

          if missing:
              raise SystemExit(
                  "Refusing to publish: no concerts found for " + ", ".join(missing)
              )
          PY

      - name: Upload concerts.json as artifact
        uses: actions/upload-artifact@v4
        with:
          name: concerts-json
          path: concerts.json

      - name: Publish concerts.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add concerts.json
          git diff --cached --quiet || git commit -m "Update concerts.json"
          git push origin main
