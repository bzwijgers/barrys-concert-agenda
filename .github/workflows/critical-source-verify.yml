name: Verify full venue agendas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/verify_critical.py"
      - ".github/workflows/critical-source-verify.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independently fetch entire high-risk venue concert schedules
        run: PYTHONPATH=. python -u audit/verify_critical.py
      - name: Upload structured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-venue-verification
          path: diagnostics/output/source-verification.json
          if-no-files-found: ignore
