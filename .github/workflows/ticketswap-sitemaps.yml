name: Inspect TicketSwap public sitemap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/ticketswap_sitemaps.py"
      - ".github/workflows/ticketswap-sitemaps.yml"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -u diagnostics/ticketswap_sitemaps.py
