name: Probe new concert venues

on:
  push:
    branches: [main]
    paths:
      - "diagnostics/*.py"
      - ".github/workflows/venue-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe venue HTML and URL shapes
        run: |
          python -u diagnostics/venue_probe.py
          python -u diagnostics/detail_probe.py
