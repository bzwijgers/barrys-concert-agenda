name: Validate Ticketmaster NL importer
on:
  push:
    branches: [main]
    paths:
      - "scrapers/ticketmaster_nl.py"
      - "scraper.py"
      - "tests/test_ticketmaster_nl.py"
      - ".github/workflows/ticketmaster-nl-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-ticketmaster:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Ticketmaster importer
        run: python -m py_compile scrapers/ticketmaster_nl.py scraper.py tests/test_ticketmaster_nl.py
      - name: Check Netherlands-only, festivals, duplicate removal and API pagination
        run: python -m unittest discover -s tests -p "test_ticketmaster_nl.py" -v
      - name: Check whether optional official API is configured
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          if test -n "$TICKETMASTER_API_KEY"; then
            echo "Ticketmaster Discovery API secret is configured."
            python - <<'PY'
          import os
          from scrapers.ticketmaster_nl import _get_json
          data = _get_json({"countryCode": "NL", "segmentId": "KZFzniwnSyZfZ7v7nJ", "size": 1}, os.environ["TICKETMASTER_API_KEY"])
          print("API total Dutch music events:", (data.get("page") or {}).get("totalElements"))
          if (data.get("page") or {}).get("totalElements", 0) < 1:
              raise SystemExit("No Dutch music events received from official API")
          PY
          else
            echo "::notice::Add GitHub repository secret TICKETMASTER_API_KEY to enable the official Ticketmaster source."
          fi

      - name: Check live Dutch concert import and existing venue duplicates
        timeout-minutes: 4
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: |
          if test -z "$TICKETMASTER_API_KEY"; then
            echo "::notice::Ticketmaster live event audit skipped until API secret is configured."
            exit 0
          fi
          python - <<'PY'
          import collections
          import json
          import os
          from scrapers.ticketmaster_nl import scrape_ticketmaster_nl, merge_ticketmaster
          with open("concerts.json", encoding="utf-8") as fp:
              official = json.load(fp)
          try:
              items = scrape_ticketmaster_nl()
          except Exception as err:
              # API URLs contain credentials: never print raw exception URLs.
              raise SystemExit("Live Ticketmaster API retrieval failed: " +
                               type(err).__name__ + " status=" +
                               str(getattr(err, "code", ""))) from None
          added, duplicates = merge_ticketmaster(official, items)
          print("Ticketmaster NL live music events:", len(items), flush=True)
          print("Ticketmaster NL duplicates with current venue feed:", duplicates, flush=True)
          print("Ticketmaster NL unique new concerts:", len(added), flush=True)
          print("Ticketmaster NL biggest venue counts:",
                collections.Counter(x["venue"] for x in added).most_common(25), flush=True)
          print("Ticketmaster NL AFAS Live diagnostics:",
                [(venue, count) for venue, count
                 in collections.Counter(x["venue"] for x in items).items()
                 if "afas" in venue.lower()], flush=True)
          print("Ticketmaster NL festival matches:",
                [x["artist"] for x in items
                 if any(word in x["artist"].lower() for word in ("pinkpop", "lowlands", "bospop"))],
                flush=True)
          # Identify same-day/same-venue artist-title mismatches still needing review.
          # This is diagnostic only: do not collapse two distinct performances.
          from difflib import SequenceMatcher
          from scrapers.ticketmaster_nl import _norm, _venue_name
          by_place = {}
          for entry in official:
              key = (entry.get("date"), _norm(entry.get("city")), _venue_name(entry.get("venue")))
              by_place.setdefault(key, []).append(entry)
          suspected = []
          for item in added:
              key = (item["date"], _norm(item["city"]), _venue_name(item["venue"]))
              for old in by_place.get(key, ()):
                  score = SequenceMatcher(None, _norm(item["artist"]), _norm(old.get("artist"))).ratio()
                  if score >= 0.55:
                      suspected.append((round(score, 2), item["date"],
                                        item["artist"], old.get("artist"), item["venue"]))
          print("Ticketmaster NL possible title-variant duplicates:",
                sorted(suspected, reverse=True)[:30], flush=True)
          if not items:
              raise SystemExit("Ticketmaster key works but scraper returned zero Dutch events")
          if any(x.get("country") != "NL" for x in added):
              raise SystemExit("Non-Dutch concert leaked into Ticketmaster results")
          PY
