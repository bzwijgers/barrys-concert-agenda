name: TicketSwap direct probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/ticketswap_direct_probe.py"
      - ".github/workflows/ticketswap-direct-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python diagnostics/ticketswap_direct_probe.py
