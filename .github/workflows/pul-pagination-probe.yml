name: Probe De Pul pagination

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "diagnostics/pul_pagination_probe.py"
      - ".github/workflows/pul-pagination-probe.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect official load-more scripts
        run: python -u diagnostics/pul_pagination_probe.py
