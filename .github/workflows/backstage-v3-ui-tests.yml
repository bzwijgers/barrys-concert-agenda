name: Backstage V3 Android UI tests

on:
  push:
    branches:
      - preview/backstage-v3
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/backstage-v3-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Compose UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            # The previous adb screenshots accidentally captured a hung Pixel
            # Launcher, not Barry's app. Instrumentation now saves true Compose
            # screenshots from the active app's root semantics.
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
            mkdir -p backstage-v3-screenshots
            adb pull /sdcard/Android/data/com.example.barrysconcertagenda.backstage/files/v3-screenshots/. backstage-v3-screenshots/
            # The workflow must fail if it did not actually capture app pages.
            for screen in home discover agenda tickets favorites more info; do
              test -s "backstage-v3-screenshots/${screen}.png" || {
                echo "Missing real Compose screenshot: ${screen}"
                exit 1
              }
            done

      - name: Upload Android UI-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstage-v3-emulator-ui-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      - name: Upload emulator screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstage-v3-emulator-screenshots
          path: backstage-v3-screenshots/*.png
          if-no-files-found: warn
