name: Backstage V3 Android UI tests

on:
  push:
    branches:
      - preview/backstage-v3
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/backstage-v3-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Compose UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            # Capture the app first; instrumentation can temporarily switch to
            # the Pixel launcher, which may show a launcher-not-responding dialog
            # during subsequent screenshot capture on a cold emulator.
            ./gradlew --no-daemon :app:installDebug
            adb shell am start -W -n com.example.barrysconcertagenda.backstage/com.example.barrysconcertagenda.MainActivity
            sleep 5
            adb shell input tap 540 550
            sleep 24
            mkdir -p backstage-v3-screenshots
            adb shell screencap -p /sdcard/backstage-home.png
            adb pull /sdcard/backstage-home.png backstage-v3-screenshots/home.png
            adb shell input tap 270 2200
            sleep 5
            adb shell screencap -p /sdcard/backstage-discover.png
            adb pull /sdcard/backstage-discover.png backstage-v3-screenshots/discover.png
            adb shell input tap 458 2200
            sleep 4
            adb shell screencap -p /sdcard/backstage-agenda.png
            adb pull /sdcard/backstage-agenda.png backstage-v3-screenshots/agenda.png
            adb shell input tap 655 2200
            sleep 3
            adb shell screencap -p /sdcard/backstage-tickets.png
            adb pull /sdcard/backstage-tickets.png backstage-v3-screenshots/tickets.png
            adb shell input tap 843 2200
            sleep 3
            adb shell screencap -p /sdcard/backstage-favorites.png
            adb pull /sdcard/backstage-favorites.png backstage-v3-screenshots/favorites.png
            adb shell input tap 1014 2200
            sleep 3
            adb shell screencap -p /sdcard/backstage-more.png
            adb pull /sdcard/backstage-more.png backstage-v3-screenshots/more.png
            adb shell input tap 465 1080
            sleep 3
            adb shell screencap -p /sdcard/backstage-info.png
            adb pull /sdcard/backstage-info.png backstage-v3-screenshots/info.png
            # Run the full Android device tests after screenshot capture.
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload Android UI-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstage-v3-emulator-ui-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      - name: Upload emulator screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstage-v3-emulator-screenshots
          path: backstage-v3-screenshots/*.png
          if-no-files-found: warn
