name: Backstage V3 Android UI tests

on:
  push:
    branches:
      - preview/backstage-v3
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/backstage-v3-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run Android Compose UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -e
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
            # Gradle may uninstall the APK after instrumentation. Explicitly
            # reinstall it before trying to launch it for visual screenshots.
            ./gradlew --no-daemon :app:installDebug
            # Capture actual emulator pixels for visual review. No interaction
            # with V1 and no change to the Android Studio installation workflow.
            adb shell am force-stop com.example.barrysconcertagenda.backstage || true
            adb shell am start -n com.example.barrysconcertagenda.backstage/com.example.barrysconcertagenda.MainActivity
            sleep 4
            adb shell input tap 540 1100
            sleep 22
            mkdir -p backstage-v3-screenshots
            adb shell screencap -p /sdcard/backstage-home.png
            adb pull /sdcard/backstage-home.png backstage-v3-screenshots/home.png
            adb shell input tap 270 2200
            sleep 3
            adb shell screencap -p /sdcard/backstage-discover.png
            adb pull /sdcard/backstage-discover.png backstage-v3-screenshots/discover.png

      - name: Upload Android UI-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstage-v3-emulator-ui-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

      - name: Upload emulator screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backstage-v3-emulator-screenshots
          path: backstage-v3-screenshots/*.png
          if-no-files-found: warn
