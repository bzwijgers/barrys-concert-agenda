name: Android build (Backstage V3)

on:
  push:
    branches:
      - main
      - preview/backstage-v3
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check Android environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Run Android unit tests and build debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee android-build.log

      - name: Audit live TicketSwap links (read-only)
        shell: bash
        run: |
          set -o pipefail
          python3 audit/audit_ticketswap_v3.py 2>&1 | tee v3-ticketswap-audit.log

      - name: Upload TicketSwap audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-ticketswap-audit
          path: v3-ticketswap-audit.log
          if-no-files-found: warn

      - name: Assert APK cannot replace V1 app
        shell: bash
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          ACTUAL=$("$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          echo "Built Backstage V3 package ID: $ACTUAL"
          test "$ACTUAL" = "com.example.barrysconcertagenda.backstage"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-build.log
          if-no-files-found: warn

      - name: Upload debug APK for phone testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: barrys-backstage-v3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
