name: Check missing concerts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit/missing_concert_probe.py"
      - "audit/verify_live_missing.py"
      - "audit/hedon_nights_check.py"
      - "audit/paradiso_recovery_check.py"
      - ".github/workflows/missing-concerts.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Verify official event pages
        run: python -u -m audit.verify_live_missing
      - name: Cross-check Hedon Nights against feed
        run: python -u -m audit.hedon_nights_check
      - name: Check Paradiso official show and recovery
        run: python -u -m audit.paradiso_recovery_check
      - name: Test absent official shows
        run: python -u -m audit.missing_concert_probe
