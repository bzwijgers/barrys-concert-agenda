name: Validate concert app changes

on:
  pull_request:
    paths:
      - "app/**"
      - "scraper.py"
      - "scrapers/**"
      - "audit/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scraper modules
        run: python -m compileall -q scraper.py scrapers audit tests
      - name: Run regression tests without live scraping or publication
        run: python -m unittest discover -s tests -p "test_*.py"

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Test and compile Android app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: concert-app-pr-debug
          path: app/build/outputs/apk/debug/app-debug.apk
